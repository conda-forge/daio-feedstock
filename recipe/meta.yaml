{% set name = "daio" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/daio-{{ version }}.tar.gz
  sha256: 9b14da6e3d0757f6e9b22b055aa1dbbcd0b27d073b17a0e6a41818c429fdfff4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - av >=17
    - h5py >=3
    - hdf5plugin

test:
  imports:
    - daio
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/danionella/daio
  summary: video and data IO tools for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bjudkewitz
