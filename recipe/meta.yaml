{% set name = "daio" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/daio-{{ version }}.tar.gz
  sha256: 39ea708ed884fce71856906e16ba1d877bbd6d36cce0d27cef4015e053638038

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - av
    - h5py
    - hdf5plugin

test:
  imports:
    - daio
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/danionella/daio
  summary: video and data IO tools for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bjudkewitz
